name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: functions/coverage/
          retention-days: 14
      # Report-only for now: surfaces known vulnerabilities in the PR/run
      # without blocking merges on them. Revisit as `audit-level=high` (or
      # stricter) once the current backlog has been triaged.
      - run: npm audit --audit-level=high || true
